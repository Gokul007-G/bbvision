name: bbvision
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  dio: ^5.9.0
  flutter:
    sdk: flutter
  get: ^4.7.3
  connectivity_plus: ^6.0.5
  shared_preferences: ^2.5.4
  image_picker: ^1.2.1
  http_parser: ^4.1.2
  intl: ^0.20.2
  pdf: ^3.10.7
  printing: ^5.12.0
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  permission_handler: ^12.0.1
  dropdown_search:  ^5.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/logo123.jpg"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
